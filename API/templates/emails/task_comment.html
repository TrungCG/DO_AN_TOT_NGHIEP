<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #17a2b8; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f8f9fa; padding: 20px; border: 1px solid #ddd; }
        .comment-box { background: white; padding: 15px; border-radius: 8px; margin: 15px 0; border-left: 4px solid #17a2b8; }
        .task-info { background: #e9ecef; padding: 10px; border-radius: 5px; margin-top: 15px; }
        .footer { text-align: center; padding: 15px; color: #666; font-size: 12px; }
        .commenter { color: #17a2b8; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💬 Bình Luận Mới</h1>
        </div>
        <div class="content">
            <p><span class="commenter">{{ commenter.username }}</span> đã bình luận trong công việc <strong>"{{ task.title }}"</strong>:</p>
            
            <div class="comment-box">
                <p>"{{ comment.body }}"</p>
            </div>
            
            <div class="task-info">
                <strong>Dự án:</strong> {{ project_name }}
            </div>
            
            <p>Vui lòng đăng nhập hệ thống để xem và phản hồi.</p>
        </div>
        <div class="footer">
            <p>Email này được gửi tự động từ Hệ thống Quản lý Công việc</p>
        </div>
    </div>
</body>
</html>
