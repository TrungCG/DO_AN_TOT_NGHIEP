<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #dc3545; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { background: #f8f9fa; padding: 20px; border: 1px solid #ddd; }
        .info-box { background: white; padding: 15px; border-radius: 8px; margin: 15px 0; }
        .footer { text-align: center; padding: 15px; color: #666; font-size: 12px; }
        .deleted { color: #dc3545; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗑️ Công Việc Đã Bị Xóa</h1>
        </div>
        <div class="content">
            <p><strong>{{ deleted_by.username }}</strong> đã xóa công việc:</p>
            
            <div class="info-box">
                <p><strong>Công việc:</strong> <span class="deleted">{{ task_title }}</span></p>
                <p><strong>Dự án:</strong> {{ project_name }}</p>
            </div>
            
            <p>Nếu bạn cho rằng đây là lỗi, vui lòng liên hệ với quản lý dự án.</p>
        </div>
        <div class="footer">
            <p>Email này được gửi tự động từ Hệ thống Quản lý Công việc</p>
        </div>
    </div>
</body>
</html>
